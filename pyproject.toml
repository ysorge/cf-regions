[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-regions"
version = "0.1.0"
description = "Version-aware lookup and geometry for CF standardized regions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND CC0-1.0 AND CC-BY-4.0 AND CC-BY-3.0 AND BSD-3-Clause AND LicenseRef-NASA-Open-Data AND LicenseRef-Public-Domain"
license-files = ["LICENSE", "DATA_LICENSES.md", "NOTICE"]
authors = [{name = "Yves Sorge"}]
maintainers = [{name = "Yves Sorge"}]
keywords = ["CF conventions", "geospatial", "climate", "ocean", "regions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = ["shapely>=2.0,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pyshp>=2.3",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/ysorge/cf-regions"
Documentation = "https://github.com/ysorge/cf-regions#readme"
Issues = "https://github.com/ysorge/cf-regions/issues"
Repository = "https://github.com/ysorge/cf-regions"
[project.scripts]
cfregions = "cfregions.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfregions = [
  "py.typed",
  "data/*.json",
  "data/versions/*.json",
  "data/schemas/*.json",
  "data/vocabularies/*.xml",
  "data/profiles/*/*/*.json",
  "data/profiles/*/*/geometry/*.geojson",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cfregions"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*"]
follow_imports = "skip"
ignore_missing_imports = true
